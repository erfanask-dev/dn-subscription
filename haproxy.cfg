global
    log stdout format raw local0
    maxconn 4096
    tune.ssl.default-dh-param 2048
    crt-base /usr/local/etc/haproxy/certs/

    # Mozilla Intermediate SSL config
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor except 127.0.0.0/8
    option  redispatch
    retries 3
    timeout connect 5000
    timeout client  50000
    timeout server  50000

# ===========================================
# Frontend: Port 443 (Standard HTTPS)
# ===========================================
frontend https_front
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/ default-server verify none
    mode http

    # ACLs for hostname detection
    acl host_dash hdr(host) -i dash.subdigital.network
    acl host_panel hdr(host) -i panel.subdigital.network

    # Routing based on hostname
    use_backend backend_dash if host_dash
    use_backend backend_panel if host_panel

    # Default fallback (if no hostname matches)
    default_backend backend_default

# ===========================================
# Frontend: Port 2096
# ===========================================
frontend https_2096
    bind *:2096 ssl crt /usr/local/etc/haproxy/certs/ default-server verify none
    mode http

    # ACLs for hostname detection
    acl host_dash hdr(host) -i dash.subdigital.network
    acl host_panel hdr(host) -i panel.subdigital.network

    # Routing based on hostname
    use_backend backend_dash if host_dash
    use_backend backend_panel if host_panel

    # Default fallback
    default_backend backend_default

# ===========================================
# Backends - CHANGE TARGET PORTS HERE
# ===========================================

# Backend for dash.subdigital.network
backend backend_dash
    mode http
    server dash_server 127.0.0.1:<DASH_TARGET_PORT> check inter 2000 rise 2 fall 3

# Backend for panel.subdigital.network
backend backend_panel
    mode http
    server panel_server 127.0.0.1:<PANEL_TARGET_PORT> check inter 2000 rise 2 fall 3

# Default backend
backend backend_default
    mode http
    server default_server 127.0.0.1:<DEFAULT_TARGET_PORT> check inter 2000 rise 2 fall 3

# ===========================================
# Stats & Monitoring (Optional)
# ===========================================
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats auth admin:<CHANGE_THIS_PASSWORD>