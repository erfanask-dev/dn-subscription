global
    log stdout format raw local0
    maxconn 4096
    tune.ssl.default-dh-param 2048
    crt-base /usr/local/etc/haproxy/certs/

    # Mozilla Intermediate SSL config
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log     global
    mode    tcp
    option  dontlognull
    option  redispatch
    retries 3
    timeout connect 5000
    timeout client  50000
    timeout server  50000

# ===========================================
# Frontend: Port 443 (HTTPS - SSL Passthrough)
# ===========================================
frontend ft_https
    bind *:443
    mode tcp

    # SNI-based routing (reads Server Name Indication from ClientHello)
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    acl sni_dash req_ssl_sni -i dash.subdigital.network
    acl sni_panel req_ssl_sni -i panel.subdigital.network

    use_backend bk_dash if sni_dash
    use_backend bk_panel if sni_panel

    default_backend bk_default

# ===========================================
# Frontend: Port 2096 (SSL Passthrough)
# ===========================================
frontend ft_2096
    bind *:2096
    mode tcp

    # SNI-based routing
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    acl sni_dash req_ssl_sni -i dash.subdigital.network
    acl sni_panel req_ssl_sni -i panel.subdigital.network

    use_backend bk_dash if sni_dash
    use_backend bk_panel if sni_panel

    default_backend bk_default

# ===========================================
# Backends - SSL Passthrough (mode tcp)
# ===========================================

# Backend for dash.subdigital.network
backend bk_dash
    mode tcp
    server dash_server <DASH_TARGET_IP>:<DASH_TARGET_PORT> check inter 2000 rise 2 fall 3 send-proxy-v2

# Backend for panel.subdigital.network
backend bk_panel
    mode tcp
    server panel_server <PANEL_TARGET_IP>:<PANEL_TARGET_PORT> check inter 2000 rise 2 fall 3 send-proxy-v2

# Default backend
backend bk_default
    mode tcp
    server default_server <DEFAULT_TARGET_IP>:<DEFAULT_TARGET_PORT> check inter 2000 rise 2 fall 3 send-proxy-v2

# ===========================================
# Stats & Monitoring (Optional, still HTTP)
# ===========================================
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats auth admin:<CHANGE_THIS_PASSWORD>